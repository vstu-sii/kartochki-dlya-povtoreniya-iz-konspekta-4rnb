name: Lab 2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-design-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка артефактов и notebook
        run: |
          python -m unittest discover -s tests -p "test_lab2*.py" -v

      - name: Setup Node for aact
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка C4 через aact
        run: npx --yes aact@beta check

      - name: Валидация compose файла
        run: docker compose -f compose.dev.yml config

      - name: Сборка compose-скелета
        run: docker compose -f compose.dev.yml build
