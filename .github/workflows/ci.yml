name: Lab3 CI

on:
  pull_request:
  push:
    branches: ["lab3-*-prototype"]

jobs:
  test-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: docker compose -f compose.yml config --quiet
      - run: docker compose -f compose.yml up -d --build --wait
      - run: curl --fail http://localhost:8080/
      - run: curl --fail http://localhost:3000/health
      - name: Verify UI gateway, API, model and database
        run: python tests/e2e_compose.py
      - if: failure()
        run: docker compose -f compose.yml logs --no-color
      - if: always()
        run: docker compose -f compose.yml down -v
