name: Test, build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to deploy or roll back to
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Tests
        env:
          MODEL_PROVIDER: deterministic
        run: python -m unittest discover -s tests -p "test_*.py"
      - run: docker compose -f compose.yml config --quiet
      - run: docker compose -f compose.yml -f compose.staging.yml config --quiet
      - run: docker build -t flashcards:${{ github.sha }} .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Require deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"
      - name: Deploy verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_REF: ${{ inputs.ref || github.sha }}
        run: curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_REF}"
      - name: Verify public health
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$PRODUCTION_HEALTH_URL"
          for attempt in {1..20}; do curl --fail --silent "$PRODUCTION_HEALTH_URL" && exit 0; sleep 15; done
          exit 1
