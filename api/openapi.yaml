openapi: 3.1.0
info:
  title: Flashcards AI API
  version: 0.3.1
  description: Public Application API for Lab3. Internal model service uses /v1/model/*
    on port 8001. Responses use flat objects; token counts are estimates. X-User-ID
    is a prototype identity assertion, not authenticated identity.
servers:
- url: http://localhost:8080/api
  description: Compose frontend gateway
- url: http://localhost:8000
  description: Application API
tags:
- name: AI
  description: Операции модельного пайплайна
paths:
  /v1/ai/card-sets:
    post:
      tags:
      - AI
      operationId: generateCardSet
      summary: Сгенерировать карточки из текста одной методички
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCardSetRequest'
            examples:
              cacheNotes:
                value:
                  document_id: doc_01J9CACHE
                  language: ru
                  pages:
                  - page: 1
                    text: Кэш процессора — быстрая память между процессором и оперативной
                      памятью.
                  - page: 2
                    text: Промах кэша происходит, когда нужных данных в кэше нет.
                  requested_card_count: 5
      responses:
        '201':
          description: Набор карточек создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSetResponse'
        '400':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '413':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '422':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '429':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '502':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '503':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /v1/ai/answer-reviews:
    post:
      tags:
      - AI
      operationId: reviewAnswer
      summary: Проверить текстовый ответ студента по одной карточке
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
            examples:
              cacheMiss:
                value:
                  session_id: ses_01J9STUDY
                  card:
                    card_id: card_2
                    question: Что происходит при промахе кэша?
                    reference_answer: Процессор обращается к более медленной оперативной
                      памяти.
                    source_page: 2
                    source_quote: Промах кэша происходит, когда нужных данных в кэше
                      нет.
                  student_answer: Процессор не находит данные и идёт за ними в оперативную
                    память.
      responses:
        '200':
          description: Ответ проверен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReviewResponse'
        '401':
          description: Не передан идентификатор владельца сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '403':
          description: Сессия или карточка принадлежат другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '400':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '404':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '422':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '429':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '502':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '503':
          description: Application or request validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Идентификатор трассировки клиента; сервер создаёт его при отсутствии.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Повтор того же запроса с тем же ключом возвращает прежний результат.
      schema:
        type: string
    UserId:
      name: X-User-ID
      in: header
      required: true
      description: Идентификатор владельца учебной сессии (prototype identity assertion).
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    DocumentPage:
      type: object
      additionalProperties: false
      required:
      - page
      - text
      properties:
        page:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 10
          maxLength: 200000
    GenerateCardSetRequest:
      type: object
      additionalProperties: false
      required:
      - document_id
      - pages
      properties:
        document_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
        language:
          type: string
          enum:
          - ru
          - en
          default: ru
        pages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/DocumentPage'
        requested_card_count:
          type: integer
          minimum: 5
          maximum: 10
          default: 5
    Card:
      type: object
      additionalProperties: false
      required:
      - card_id
      - question
      - reference_answer
      - source_page
      - source_quote
      - difficulty
      properties:
        card_id:
          type: string
          pattern: ^card_[A-Za-z0-9_-]{1,48}$
        question:
          type: string
          minLength: 1
          maxLength: 500
        reference_answer:
          type: string
          minLength: 1
          maxLength: 1200
        source_page:
          type: integer
          minimum: 1
        source_quote:
          type: string
          minLength: 1
          maxLength: 500
          description: Короткая дословная цитата из указанной страницы.
        difficulty:
          type: string
          enum:
          - basic
          - intermediate
          - advanced
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
    TokenUsage:
      type: object
      additionalProperties: false
      properties:
        input_tokens: &id001
          type: integer
          minimum: 0
        output_tokens: *id001
      required:
      - input_tokens
      - output_tokens
    CardSetResponse:
      type: object
      additionalProperties: false
      properties:
        card_set_id: &id002
          type: string
        title: *id002
        model: *id002
        prompt_version: *id002
        fallback_used: &id007
          type: boolean
        fallback_reason: &id009
          type:
          - string
          - 'null'
          description: Safe category for primary-provider fallback; never contains credentials or provider response bodies.
        latency_ms: *id001
        usage: &id008
          $ref: '#/components/schemas/TokenUsage'
        cards:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Card'
      required:
      - card_set_id
      - title
      - model
      - prompt_version
      - fallback_used
      - fallback_reason
      - latency_ms
      - usage
      - cards
    ReviewCardContext:
      type: object
      additionalProperties: false
      required:
      - card_id
      - question
      - reference_answer
      - source_page
      - source_quote
      properties:
        card_id:
          type: string
        question:
          type: string
          minLength: 0
          maxLength: 500
        reference_answer:
          type: string
          minLength: 0
          maxLength: 1200
        source_page:
          type: integer
          minimum: 1
        source_quote:
          type: string
          minLength: 0
          maxLength: 500
        difficulty:
          type: string
          default: basic
    ReviewAnswerRequest:
      type: object
      additionalProperties: false
      required:
      - session_id
      - card
      - student_answer
      properties:
        session_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
        card:
          $ref: '#/components/schemas/ReviewCardContext'
        student_answer:
          type: string
          minLength: 1
          maxLength: 2000
    AnswerReview:
      type: object
      additionalProperties: false
      required:
      - verdict
      - score
      - feedback
      - missing_points
      properties:
        verdict: &id003
          type: string
          enum:
          - correct
          - partially_correct
          - incorrect
        score: &id004
          type: integer
          minimum: 0
          maximum: 2
          description: 0 — неверно, 1 — частично, 2 — верно.
        feedback: &id005
          type: string
          minLength: 1
          maxLength: 600
        missing_points: &id006
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 200
    AnswerReviewResponse:
      type: object
      additionalProperties: false
      properties:
        verdict: *id003
        score: *id004
        feedback: *id005
        missing_points: *id006
        model: *id002
        prompt_version: *id002
        fallback_used: *id007
        fallback_reason: *id009
        latency_ms: *id001
        usage: *id008
        review_id: *id002
        trace_id: *id002
      required:
      - verdict
      - score
      - feedback
      - missing_points
      - model
      - prompt_version
      - fallback_used
      - fallback_reason
      - latency_ms
      - usage
      - review_id
      - trace_id
    HttpError:
      type: object
      required:
      - detail
      properties:
        detail:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
          - type: string
