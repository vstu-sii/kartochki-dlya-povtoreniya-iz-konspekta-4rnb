openapi: 3.1.0
info:
  title: Flashcards AI API
  version: 0.2.0
  description: >-
    Внутренний контракт AI-сервиса: генерация карточек из уже извлечённого
    текста PDF и проверка ответа студента. PDF извлекается прикладным backend.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: AI
    description: Операции модельного пайплайна

paths:
  /v1/ai/card-sets:
    post:
      tags: [AI]
      operationId: generateCardSet
      summary: Сгенерировать карточки из текста одной методички
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCardSetRequest'
            examples:
              cacheNotes:
                value:
                  document_id: doc_01J9CACHE
                  language: ru
                  pages:
                    - page: 1
                      text: Кэш процессора — быстрая память между процессором и оперативной памятью.
                    - page: 2
                      text: Промах кэша происходит, когда нужных данных в кэше нет.
                  requested_card_count: 5
      responses:
        '201':
          description: Набор карточек создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Документ превышает продуктовый лимит контекста
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooLarge:
                  value:
                    type: https://example.local/problems/document-too-large
                    title: Document is too large
                    status: 413
                    code: DOCUMENT_TOO_LARGE
                    detail: Извлечённый текст превышает 60000 оценочных токенов.
                    trace_id: tr_01J9ABC
        '422':
          description: Текста недостаточно для генерации карточек
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/InvalidModelOutput'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /v1/ai/answer-reviews:
    post:
      tags: [AI]
      operationId: reviewAnswer
      summary: Проверить текстовый ответ студента по одной карточке
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
            examples:
              cacheMiss:
                value:
                  session_id: ses_01J9STUDY
                  card:
                    card_id: card_2
                    question: Что происходит при промахе кэша?
                    reference_answer: Процессор обращается к более медленной оперативной памяти.
                    source_page: 2
                    source_quote: Промах кэша происходит, когда нужных данных в кэше нет.
                  student_answer: Процессор не находит данные и идёт за ними в оперативную память.
      responses:
        '200':
          description: Ответ проверен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Карточка или сессия не найдена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Пустой или слишком длинный ответ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/InvalidModelOutput'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Идентификатор трассировки клиента; сервер создаёт его при отсутствии.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Повтор того же запроса с тем же ключом возвращает прежний результат.
      schema:
        type: string
        minLength: 16
        maxLength: 128

  schemas:
    DocumentPage:
      type: object
      additionalProperties: false
      required: [page, text]
      properties:
        page:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 200000

    GenerateCardSetRequest:
      type: object
      additionalProperties: false
      required: [document_id, language, pages]
      properties:
        document_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        language:
          type: string
          enum: [ru, en]
        pages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/DocumentPage'
        requested_card_count:
          type: integer
          minimum: 5
          maximum: 10
          default: 8

    Card:
      type: object
      additionalProperties: false
      required:
        - card_id
        - question
        - reference_answer
        - source_page
        - source_quote
        - difficulty
      properties:
        card_id:
          type: string
          pattern: '^card_[A-Za-z0-9_-]{1,48}$'
        question:
          type: string
          minLength: 10
          maxLength: 500
        reference_answer:
          type: string
          minLength: 10
          maxLength: 1200
        source_page:
          type: integer
          minimum: 1
        source_quote:
          type: string
          minLength: 5
          maxLength: 500
          description: Короткая дословная цитата из указанной страницы.
        difficulty:
          type: string
          enum: [basic, intermediate, advanced]
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40

    CardSet:
      type: object
      additionalProperties: false
      required: [status, document_id, title, cards]
      properties:
        status:
          type: string
          enum: [ready]
        document_id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        cards:
          type: array
          minItems: 5
          maxItems: 10
          items:
            $ref: '#/components/schemas/Card'

    GenerationMeta:
      type: object
      additionalProperties: false
      required:
        - trace_id
        - model
        - prompt_version
        - schema_version
        - fallback_used
        - latency_ms
        - usage
      properties:
        trace_id:
          type: string
        model:
          type: string
          enum: [gemini-3.8-flash, gemini-3.5-flash-lite]
        prompt_version:
          type: string
          pattern: '^cards-v[0-9]+$|^review-v[0-9]+$'
        schema_version:
          type: string
          const: '1.0'
        fallback_used:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        usage:
          $ref: '#/components/schemas/TokenUsage'

    TokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, estimated_cost_usd]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
          default: 0
        output_tokens:
          type: integer
          minimum: 0
        estimated_cost_usd:
          type: number
          minimum: 0
          multipleOf: 0.000001

    CardSetResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CardSet'
        meta:
          $ref: '#/components/schemas/GenerationMeta'

    ReviewCardContext:
      type: object
      additionalProperties: false
      required: [card_id, question, reference_answer, source_page, source_quote]
      properties:
        card_id:
          type: string
        question:
          type: string
          minLength: 10
          maxLength: 500
        reference_answer:
          type: string
          minLength: 10
          maxLength: 1200
        source_page:
          type: integer
          minimum: 1
        source_quote:
          type: string
          minLength: 5
          maxLength: 500

    ReviewAnswerRequest:
      type: object
      additionalProperties: false
      required: [session_id, card, student_answer]
      properties:
        session_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        card:
          $ref: '#/components/schemas/ReviewCardContext'
        student_answer:
          type: string
          minLength: 1
          maxLength: 2000

    AnswerReview:
      type: object
      additionalProperties: false
      required: [verdict, score, feedback, missing_points]
      properties:
        verdict:
          type: string
          enum: [correct, partially_correct, incorrect]
        score:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 — неверно, 1 — частично, 2 — верно.
        feedback:
          type: string
          minLength: 1
          maxLength: 600
        missing_points:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 200

    AnswerReviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AnswerReview'
        meta:
          $ref: '#/components/schemas/GenerationMeta'

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - DOCUMENT_TOO_LARGE
            - INSUFFICIENT_CONTENT
            - PDF_TEXT_LAYER_REQUIRED
            - ANSWER_TOO_LONG
            - NOT_FOUND
            - RATE_LIMITED
            - MODEL_OUTPUT_INVALID
            - AI_PROVIDER_UNAVAILABLE
        detail:
          type: string
        trace_id:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1

  responses:
    BadRequest:
      description: Нарушен формат запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Исчерпан лимит запросов приложения
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить запрос.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidModelOutput:
      description: Ответ обеих попыток не прошёл schema/grounding validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: Основная и резервная модели недоступны
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
