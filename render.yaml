services:
  - type: web
    name: kartochki-dlya-povtoreniya-iz-konspekta
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_VERSION
        value: lab5
      - key: MODEL_PROVIDER
        value: gemini
      - key: LLM_PRIMARY_MODEL
        value: gemini-3.8-flash
      - key: LLM_CHEAP_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_MAX_ATTEMPTS
        value: "2"
      - key: TRACE_CONTENT
        value: "false"
      - key: OCR_LANGUAGES
        value: rus+eng
      - key: MAX_REQUESTS_PER_USER_DAY
        value: "50"
      - key: MAX_TOKENS_PER_USER_DAY
        value: "120000"
      - key: BUDGET_DEGRADE_RATIO
        value: "0.80"
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
