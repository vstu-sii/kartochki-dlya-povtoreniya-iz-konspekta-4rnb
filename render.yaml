services:
  - type: web
    name: kartochki-dlya-povtoreniya-iz-konspekta
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MODEL_PROVIDER
        value: deterministic
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
